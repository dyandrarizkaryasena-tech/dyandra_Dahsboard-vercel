<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Unduh data OHLCV KOMPAS100</title>
<style>body{font:15px/1.5 system-ui,Segoe UI,sans-serif;max-width:720px;margin:30px auto;padding:0 16px;background:#f6f3ec;color:#1c1b22}button{background:#5b3df5;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:700;font-size:15px;cursor:pointer}button:disabled{opacity:.5}.card{background:#fff;border:1px solid #e6e0d2;border-radius:14px;padding:16px;margin:14px 0}#log{font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;max-height:260px;overflow:auto;background:#fafafa;border-radius:8px;padding:8px}progress{width:100%}</style></head><body>
<h2>Unduh data OHLCV KOMPAS100</h2>
<div class="card">Halaman ini mengambil data harian (Open, High, Low, Close, Volume, dividen) dari Yahoo Finance lewat server Vercel Anda, lalu menyimpannya sebagai satu file <b>kompas100_ohlcv.json.gz</b>. Ini hanya alat bantu untuk mengumpulkan data, bukan file yang dikumpulkan ke dosen.</div>
<div class="card"><button id="go">▶ Mulai unduh</button> <span id="st"></span><br><br><progress id="pg" value="0" max="1"></progress><div id="log"></div></div>
<script>
const TK="AADI ACES ADRO AKRA AMMN AMRT ANTM ARTO ASII AUTO AVIA BBCA BBNI BBRI BBTN BBYB BFIN BMRI BNGA BRIS BRMS BRPT BSDE BTPS BUKA CMRY CPIN CTRA DEWA DOID DSNG ELSA EMTK ENRG ERAA ESSA EXCL FILM GGRM GOTO HEAL HRUM ICBP INCO INDF INDY INKP INTP ISAT ITMG JPFA JSMR KIJA KLBF LSIP MAPA MAPI MBMA MDKA MEDC MIDI MIKA MNCN MTEL MYOR NCKL PANI PGAS PGEO PNLF PTBA PTPP PWON RAJA SCMA SIDO SILO SMGR SMRA SRTG SSIA TAPG TBIG TINS TKIM TLKM TOWR TPIA UNTR UNVR WIFI WIKA WSKT".split(" ").concat(["^JKSE","^JKLQ45"]);
const log=t=>{const e=document.getElementById('log');e.textContent+=t+"\n";e.scrollTop=e.scrollHeight};
async function one(t){for(let k=0;k<3;k++){try{const r=await fetch('/api/ohlcv?symbol='+encodeURIComponent(t));if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();if(!j.d||j.d.length<30)throw new Error('data kosong');return j}catch(e){if(k==2)throw e;await new Promise(r=>setTimeout(r,1500*(k+1)))}}}
document.getElementById('go').onclick=async()=>{const b=document.getElementById('go');b.disabled=true;const q=TK.slice(),D={},bad=[];let n=0;
await Promise.all(Array.from({length:4},async()=>{while(q.length){const t=q.shift();try{D[t]=await one(t);log('OK   '+t+'  '+D[t].d.length+' bar  ('+D[t].d[0]+' s/d '+D[t].d[D[t].d.length-1]+')')}catch(e){bad.push(t);log('GAGAL '+t+'  '+e.message)}document.getElementById('pg').value=++n/TK.length;document.getElementById('st').textContent=n+'/'+TK.length}}));
const out={meta:{source:'Yahoo Finance (chart API v8, interval 1d), via server Vercel sendiri',downloaded:new Date().toISOString(),universe_list:TK.filter(x=>x[0]!='^'),failed:bad,price_note:'o,h,l,c = harga mentah yang sudah disesuaikan stock split oleh Yahoo; a = faktor penyesuaian dividen (adjclose/close); dv = dividen tunai; sp = split'},data:D};
const js=JSON.stringify(out);let blob,name;if(window.CompressionStream){blob=await new Response(new Blob([js]).stream().pipeThrough(new CompressionStream('gzip'))).blob();name='kompas100_ohlcv.json.gz'}else{blob=new Blob([js]);name='kompas100_ohlcv.json'}
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();log('\nSelesai: '+name+' ('+(blob.size/1e6).toFixed(1)+' MB). Gagal: '+(bad.join(', ')||'tidak ada'));b.disabled=false};
</script></body></html>
